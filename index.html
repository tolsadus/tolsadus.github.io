<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tolsadus</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0614;
            --fg: #e9e0f7;
            --accent: #b388ff;
            --accent-soft: rgba(179, 136, 255, 0.55);
            --accent-faint: rgba(179, 136, 255, 0.22);
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        canvas#glyphs { position: fixed; top: 0; left: 0; z-index: 0; }

        .aurora {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background:
                radial-gradient(ellipse 60% 50% at 30% 35%, rgba(110, 60, 190, 0.20), transparent 70%),
                radial-gradient(ellipse 55% 45% at 72% 68%, rgba(70, 40, 140, 0.18), transparent 70%);
        }
        .vignette {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(5, 3, 12, 0.85) 100%);
        }

        .container {
            position: relative; z-index: 2;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 2rem;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900; font-size: 3.2rem;
            letter-spacing: 0.28em; text-transform: uppercase;
            color: var(--fg);
            text-shadow: 0 0 18px rgba(179, 136, 255, 0.45);
            margin-bottom: 1.1rem; min-height: 3.4rem;
        }

        .tagline {
            font-size: 0.82rem; letter-spacing: 0.4em; text-transform: uppercase;
            color: var(--accent-soft); margin-bottom: 3rem; min-height: 1.1rem;
        }
        .caret { animation: blink 1.1s steps(1) infinite; color: var(--accent); }
        @keyframes blink { 50% { opacity: 0; } }

        .links { display: flex; gap: 1.1rem; flex-wrap: wrap; justify-content: center; }

        .links a {
            position: relative; display: flex; align-items: center; gap: 0.55rem;
            padding: 0.7rem 1.4rem; color: var(--fg); text-decoration: none;
            font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase;
            border: 1px solid var(--accent-faint); border-radius: 3px;
            transition: all 0.3s ease; overflow: hidden;
        }
        .links a::before {
            content: ''; position: absolute; inset: 0; left: -100%;
            background: linear-gradient(90deg, transparent, rgba(179, 136, 255, 0.12), transparent);
            transition: left 0.5s ease;
        }
        .links a:hover::before { left: 100%; }
        .links a:hover {
            border-color: var(--accent-soft); color: var(--accent);
            box-shadow: 0 0 20px rgba(179, 136, 255, 0.18);
        }
        .links a svg { width: 16px; height: 16px; fill: currentColor; }

        .coord {
            position: fixed; bottom: 1.5rem; font-size: 0.64rem;
            letter-spacing: 0.3em; color: var(--accent-faint); z-index: 2;
        }
        .coord-left { left: 1.5rem; }
        .coord-right { right: 1.5rem; }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; letter-spacing: 0.18em; min-height: 2rem; }
            .tagline { font-size: 0.68rem; }
            .links { gap: 0.7rem; }
            .links a { padding: 0.6rem 1rem; font-size: 0.72rem; }
        }
    </style>
</head>
<body>
    <canvas id="glyphs"></canvas>
    <div class="aurora"></div>
    <div class="vignette"></div>

    <div class="container">
        <h1 id="title"></h1>
        <p class="tagline"><span id="tagline"></span><span class="caret">_</span></p>

        <div class="links">
            <a href="https://tolsadus.github.io/TeslaPricing/" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M3 3v18h18v-2H5V3H3zm4 12h2v-4H7v4zm4 0h2V7h-2v8zm4 0h2v-6h-2v6z"/></svg>
                teslaPricing
            </a>
            <a href="https://chromewebstore.google.com/detail/tesla-price-history/mchiolkjdnabmjboojigecfmegloobia" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M12 0C8.21 0 4.831 1.757 2.632 4.501l3.953 6.848A5.454 5.454 0 0 1 12 6.545h10.691A12 12 0 0 0 12 0zM1.931 5.47A11.943 11.943 0 0 0 0 12c0 6.012 4.42 10.991 10.189 11.864l3.953-6.847a5.45 5.45 0 0 1-6.865-2.29zm13.342 2.166a5.446 5.446 0 0 1 1.45 7.09l-5.05 8.74H12A12 12 0 0 0 24 12a11.95 11.95 0 0 0-1.575-5.95zM12 16.364a4.364 4.364 0 1 1 0-8.728 4.364 4.364 0 0 1 0 8.728z"/></svg>
                Tesla Price History - TPH
            </a>
            <a href="https://github.com/tolsadus" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                GitHub
            </a>
        </div>
    </div>

    <span class="coord coord-left">SIG /// 0x7E2</span>
    <span class="coord coord-right">FREQ /// 14.2 MHz</span>

    <script>
        const alienChars = '᐀ᐁᐂᐃᐄᐅᐆᐇᐈᐉᐊᐋᐌᐍᐎᐏᐐᐑᐒᐓᐔᐕᐖᐗᐘᐙᐚᐛᚠᚡᚢᚣᚤᚥᚦᚧᚨᚩᚪᚫᚬᚭᚮᚯᚰᚱᚲᚳᚴᚵᚶᚷᚸᚹⴰⴱⴲⴳⴴⴵⴶⴷⴸⴹⴺⴻⴼⴽⴾⴿⵀⵁⵂⵃⵄⵅⵆⵇⵈⵉ';
        const rnd = (set) => set[Math.floor(Math.random() * set.length)];

        // ---- Hybrid title: decode glyphs INTO the real name, then settle ----
        const TITLE = 'tolsadus';
        const TAGLINE = 'exploring the quantum void';
        const scrambleSet = alienChars + 'abcdefghijklmnopqrstuvwxyz';
        const titleEl = document.getElementById('title');
        const taglineEl = document.getElementById('tagline');

        function decodeInto(el, target, totalMs, onDone) {
            const len = target.length;
            const start = performance.now();
            (function frame(now) {
                const p = Math.min(1, (now - start) / totalMs);
                const locked = p * len;
                let out = '';
                for (let i = 0; i < len; i++) {
                    if (target[i] === ' ') { out += ' '; continue; }
                    out += i < locked ? target[i] : rnd(scrambleSet);
                }
                el.textContent = out;
                if (p < 1) requestAnimationFrame(frame);
                else { el.textContent = target; onDone && onDone(); }
            })(start);
        }

        decodeInto(titleEl, TITLE, 2200);
        setTimeout(() => decodeInto(taglineEl, TAGLINE, 2600), 700);

        // ---- Ambient glyphs: appear and disappear in place (no falling) ----
        const canvas = document.getElementById('glyphs');
        const ctx = canvas.getContext('2d');
        let w, h, particles;
        const COUNT = 70;
        const fontSize = 20;

        function spawn() {
            return {
                x: Math.random() * w,
                y: Math.random() * h,
                ch: rnd(alienChars),
                phase: Math.random() * Math.PI,     // start mid-cycle so they're staggered
                speed: 0.0016 + Math.random() * 0.0022, // slow fade
                maxAlpha: 0.18 + Math.random() * 0.32
            };
        }

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            particles = Array.from({ length: COUNT }, spawn);
        }

        let last = performance.now();
        function draw(now) {
            const dt = now - last; last = now;
            ctx.clearRect(0, 0, w, h);
            ctx.font = fontSize + "px 'Space Mono', monospace";
            ctx.textAlign = 'center';

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.phase += p.speed * dt;
                // sin gives a smooth fade-in then fade-out
                const alpha = Math.sin(p.phase) * p.maxAlpha;
                if (alpha <= 0) { particles[i] = spawn(); particles[i].phase = 0; continue; }
                ctx.fillStyle = `rgba(179, 136, 255, ${alpha})`;
                ctx.fillText(p.ch, p.x, p.y);
            }
            requestAnimationFrame(draw);
        }

        init();
        requestAnimationFrame(draw);
        window.addEventListener('resize', init);
    </script>
</body>
</html>

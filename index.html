<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tolsadus</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050510;
            color: #e0dcd0;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: none;
        }

        canvas#starfield { position: fixed; top: 0; left: 0; z-index: 0; }
        canvas#cursor-layer { position: fixed; top: 0; left: 0; z-index: 10; pointer-events: none; }

        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(3, 3, 10, 0.85) 100%);
            z-index: 1; pointer-events: none;
        }

        .container {
            position: relative; z-index: 2;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 2rem; pointer-events: none;
        }

        .container a { pointer-events: auto; cursor: none; }

        .blackhole-spacer { width: 200px; height: 200px; margin-bottom: 2rem; }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900; font-size: 3rem;
            letter-spacing: 0.3em; text-transform: uppercase;
            background: linear-gradient(135deg, #1e50a0, #3a5fc0, #1e50a0);
            background-size: 200% 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 6s ease infinite;
            margin-bottom: 1rem;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .tagline {
            font-size: 0.85rem; letter-spacing: 0.4em; text-transform: uppercase;
            color: rgba(40, 50, 120, 0.7); margin-bottom: 3rem;
        }

        .links { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }

        .links a {
            position: relative; display: flex; align-items: center; gap: 0.5rem;
            padding: 0.75rem 1.5rem; color: #e0dcd0; text-decoration: none;
            font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase;
            border: 1px solid rgba(30, 80, 160, 0.25); border-radius: 2px;
            transition: all 0.3s ease; overflow: hidden;
        }

        .links a::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(30, 80, 160, 0.08), transparent);
            transition: left 0.5s ease;
        }

        .links a:hover::before { left: 100%; }

        .links a:hover {
            border-color: rgba(30, 80, 160, 0.6); color: #3a6fc0;
            box-shadow: 0 0 20px rgba(30, 80, 160, 0.15), inset 0 0 20px rgba(30, 80, 160, 0.05);
        }

        .links a svg { width: 18px; height: 18px; fill: currentColor; }

        .coord {
            position: fixed; bottom: 1.5rem; font-size: 0.65rem;
            letter-spacing: 0.3em; color: rgba(30, 80, 160, 0.3);
            font-family: 'Space Mono', monospace;
        }

        .coord-left { left: 1.5rem; }
        .coord-right { right: 1.5rem; }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; letter-spacing: 0.2em; }
            .tagline { font-size: 0.7rem; }
            .blackhole-spacer { width: 140px; height: 140px; }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <canvas id="cursor-layer"></canvas>
    <div class="vignette"></div>

    <div class="container">
        <div class="blackhole-spacer"></div>

        <h1 id="alien-title">tolsadus</h1>
        <p class="tagline" id="alien-tagline">exploring the quantum void</p>

        <div class="links">
            <a href="https://x.com/" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                X / Twitter
            </a>
            <a href="http://github.com/" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                GitHub
            </a>
        </div>
    </div>

    <span class="coord coord-left">SIG /// 0x7E2</span>
    <span class="coord coord-right">FREQ /// 14.2 MHz</span>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        const cursorCanvas = document.getElementById('cursor-layer');
        const cctx = cursorCanvas.getContext('2d');

        // Offscreen canvas for pre-lensing starfield
        const offscreen = document.createElement('canvas');
        const octx = offscreen.getContext('2d');

        let w, h, stars, shootingStars;
        let bhx, bhy;

        const EVENT_HORIZON = 35;
        const EINSTEIN_RADIUS = 70;
        const LENSING_REGION = 180;

        function init() {
            w = canvas.width = cursorCanvas.width = offscreen.width = window.innerWidth;
            h = canvas.height = cursorCanvas.height = offscreen.height = window.innerHeight;

            const spacer = document.querySelector('.blackhole-spacer');
            if (spacer) {
                const rect = spacer.getBoundingClientRect();
                bhx = rect.left + rect.width / 2;
                bhy = rect.top + rect.height / 2;
            } else {
                bhx = w / 2; bhy = h / 2 - 80;
            }

            stars = Array.from({ length: 500 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.8 + 0.3,
                speed: Math.random() * 0.3 + 0.05,
                flicker: Math.random() * Math.PI * 2,
                flickerSpeed: Math.random() * 0.02 + 0.005
            }));
            shootingStars = [];
        }

        function spawnShootingStar() {
            if (Math.random() < 0.003 && shootingStars.length < 2) {
                shootingStars.push({
                    x: Math.random() * w, y: 0,
                    len: Math.random() * 80 + 40,
                    speed: Math.random() * 6 + 4,
                    angle: Math.PI / 4 + Math.random() * 0.3,
                    opacity: 1
                });
            }
        }

        function drawStarsToOffscreen() {
            octx.fillStyle = '#050510';
            octx.fillRect(0, 0, w, h);

            // Nebula
            const grd = octx.createRadialGradient(w * 0.3, h * 0.4, 0, w * 0.3, h * 0.4, w * 0.5);
            grd.addColorStop(0, 'rgba(20, 20, 60, 0.06)');
            grd.addColorStop(1, 'transparent');
            octx.fillStyle = grd;
            octx.fillRect(0, 0, w, h);

            const grd2 = octx.createRadialGradient(w * 0.7, h * 0.6, 0, w * 0.7, h * 0.6, w * 0.4);
            grd2.addColorStop(0, 'rgba(15, 30, 80, 0.05)');
            grd2.addColorStop(1, 'transparent');
            octx.fillStyle = grd2;
            octx.fillRect(0, 0, w, h);

            // Stars
            for (const s of stars) {
                s.flicker += s.flickerSpeed;
                s.y += s.speed;
                if (s.y > h + 5) { s.y = -5; s.x = Math.random() * w; }

                const opacity = 0.5 + Math.sin(s.flicker) * 0.3;
                octx.beginPath();
                octx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                octx.fillStyle = `rgba(200, 210, 240, ${opacity})`;
                octx.fill();

                if (s.r > 1.3) {
                    octx.beginPath();
                    octx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
                    octx.fillStyle = `rgba(150, 180, 220, ${opacity * 0.08})`;
                    octx.fill();
                }
            }

            // Shooting stars
            spawnShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                const endX = ss.x - Math.cos(ss.angle) * ss.len;
                const endY = ss.y - Math.sin(ss.angle) * ss.len;
                const grad = octx.createLinearGradient(ss.x, ss.y, endX, endY);
                grad.addColorStop(0, `rgba(200, 220, 255, ${ss.opacity})`);
                grad.addColorStop(1, 'transparent');
                octx.beginPath();
                octx.moveTo(ss.x, ss.y);
                octx.lineTo(endX, endY);
                octx.strokeStyle = grad;
                octx.lineWidth = 1.5;
                octx.stroke();
                ss.x += Math.cos(ss.angle) * ss.speed;
                ss.y += Math.sin(ss.angle) * ss.speed;
                ss.opacity -= 0.008;
                if (ss.opacity <= 0 || ss.x > w + 100 || ss.y > h + 100) {
                    shootingStars.splice(i, 1);
                }
            }
        }

        function applyGravitationalLensing() {
            // Copy the offscreen (unlensed) starfield to main canvas
            ctx.drawImage(offscreen, 0, 0);

            // Define the region around the black hole to distort
            const regionSize = LENSING_REGION + 40;
            const rx = Math.max(0, Math.floor(bhx - regionSize));
            const ry = Math.max(0, Math.floor(bhy - regionSize));
            const rw = Math.min(w - rx, Math.ceil(regionSize * 2));
            const rh = Math.min(h - ry, Math.ceil(regionSize * 2));

            if (rw <= 0 || rh <= 0) return;

            // Read source pixels from the offscreen (unlensed) canvas
            const srcData = octx.getImageData(rx, ry, rw, rh);
            const src = srcData.data;

            // Create output buffer
            const dstData = ctx.createImageData(rw, rh);
            const dst = dstData.data;

            const RE2 = EINSTEIN_RADIUS * EINSTEIN_RADIUS;
            const localBHX = bhx - rx;
            const localBHY = bhy - ry;

            for (let py = 0; py < rh; py++) {
                for (let px = 0; px < rw; px++) {
                    const dx = px - localBHX;
                    const dy = py - localBHY;
                    const d = Math.sqrt(dx * dx + dy * dy);

                    const dstIdx = (py * rw + px) * 4;

                    if (d < EVENT_HORIZON) {
                        // Inside event horizon: pure black
                        dst[dstIdx] = 5;
                        dst[dstIdx + 1] = 5;
                        dst[dstIdx + 2] = 16;
                        dst[dstIdx + 3] = 255;
                        continue;
                    }

                    if (d < LENSING_REGION) {
                        // Gravitational lensing: sample from displaced source position
                        // The source is pulled inward (we see light from further out)
                        const lensStrength = RE2 / d;
                        const sourceD = d + lensStrength;
                        const angle = Math.atan2(dy, dx);

                        let sx = Math.round(localBHX + Math.cos(angle) * sourceD);
                        let sy = Math.round(localBHY + Math.sin(angle) * sourceD);

                        // Clamp to canvas
                        sx = Math.max(0, Math.min(rw - 1, sx));
                        sy = Math.max(0, Math.min(rh - 1, sy));

                        const srcIdx = (sy * rw + sx) * 4;

                        // Brightness amplification near Einstein ring
                        const ringDist = Math.abs(d - EINSTEIN_RADIUS);
                        const amp = 1 + Math.max(0, 1 - ringDist / 30) * 1.5;

                        dst[dstIdx] = Math.min(255, src[srcIdx] * amp);
                        dst[dstIdx + 1] = Math.min(255, src[srcIdx + 1] * amp);
                        dst[dstIdx + 2] = Math.min(255, src[srcIdx + 2] * amp);
                        dst[dstIdx + 3] = 255;
                    } else {
                        // Outside lensing: copy directly
                        const srcIdx = (py * rw + px) * 4;
                        dst[dstIdx] = src[srcIdx];
                        dst[dstIdx + 1] = src[srcIdx + 1];
                        dst[dstIdx + 2] = src[srcIdx + 2];
                        dst[dstIdx + 3] = src[srcIdx + 3];
                    }
                }
            }

            ctx.putImageData(dstData, rx, ry);

            // Draw accretion disk glow on top
            const time = Date.now() * 0.0008;

            ctx.save();
            ctx.translate(bhx, bhy);

            // Thin accretion disk — tilted ellipse
            for (let ring = 0; ring < 25; ring++) {
                const radius = EVENT_HORIZON + 8 + ring * 3;
                const distFactor = 1 - ring / 25;
                const baseAlpha = 0.06 + 0.08 * distFactor;

                for (let seg = 0; seg < 8; seg++) {
                    const startAngle = time * (1.2 - ring * 0.015) + seg * Math.PI / 4;
                    const arcLen = Math.PI / 5 + Math.sin(time * 2 + ring * 0.3 + seg) * Math.PI / 10;
                    const alpha = baseAlpha * (0.4 + 0.6 * Math.sin(time * 1.5 + ring + seg));

                    const r = Math.round(20 + 25 * distFactor);
                    const g = Math.round(50 + 60 * distFactor);
                    const b = Math.round(120 + 80 * distFactor);

                    ctx.beginPath();
                    ctx.ellipse(0, 0, radius, radius * 0.3, 0.4, startAngle, startAngle + arcLen);
                    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    ctx.lineWidth = 1.5 - ring * 0.04;
                    ctx.stroke();
                }
            }

            // Bright photon ring
            ctx.beginPath();
            ctx.ellipse(0, 0, EVENT_HORIZON + 5, (EVENT_HORIZON + 5) * 0.3, 0.4, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(60, 100, 180, ${0.15 + Math.sin(time * 3) * 0.05})`;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, 0, EVENT_HORIZON + 3, (EVENT_HORIZON + 3) * 0.3, 0.4, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(80, 130, 200, ${0.1 + Math.sin(time * 3 + 1) * 0.04})`;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.restore();

            // Soft dark fade at event horizon edge
            const bhEdge = ctx.createRadialGradient(bhx, bhy, EVENT_HORIZON - 5, bhx, bhy, EVENT_HORIZON + 8);
            bhEdge.addColorStop(0, 'rgba(5, 5, 16, 1)');
            bhEdge.addColorStop(0.5, 'rgba(5, 5, 16, 0.8)');
            bhEdge.addColorStop(1, 'rgba(5, 5, 16, 0)');
            ctx.beginPath();
            ctx.arc(bhx, bhy, EVENT_HORIZON + 8, 0, Math.PI * 2);
            ctx.fillStyle = bhEdge;
            ctx.fill();
        }

        // ---- Cursor ----
        let mouse = { x: 0, y: 0 };
        let cursor = { x: 0, y: 0 };
        const trail = [];
        const trailLen = 25;
        let mouseActive = false;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            if (!mouseActive) { cursor.x = mouse.x; cursor.y = mouse.y; mouseActive = true; }
        });

        const sparkles = [];

        function spawnSparkles(x, y) {
            for (let i = 0; i < 5; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1;
                sparkles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: Math.random() * 0.025 + 0.012,
                    size: Math.random() * 2.5 + 1,
                    hue: Math.random() > 0.5 ? '30, 80, 160' : '50, 100, 180'
                });
            }
        }

        function drawSparkles() {
            for (let i = sparkles.length - 1; i >= 0; i--) {
                const sp = sparkles[i];
                sp.x += sp.vx; sp.y += sp.vy;
                sp.vx *= 0.96; sp.vy *= 0.96;
                sp.life -= sp.decay;
                if (sp.life <= 0) { sparkles.splice(i, 1); continue; }

                cctx.beginPath();
                cctx.arc(sp.x, sp.y, sp.size * sp.life, 0, Math.PI * 2);
                cctx.fillStyle = `rgba(${sp.hue}, ${sp.life * 0.7})`;
                cctx.fill();
            }
        }

        let sparkleThrottle = 0;

        function getCursorColor() {
            const dist = Math.hypot(cursor.x - bhx, cursor.y - bhy);
            const maxDist = Math.max(w, h) * 0.35;
            const t = Math.max(0, Math.min(1, 1 - dist / maxDist));
            let r, g, b;
            if (t < 0.5) {
                const p = t / 0.5;
                r = 120 + (30 - 120) * p;
                g = 30 + (80 - 30) * p;
                b = 30 + (160 - 30) * p;
            } else {
                const p = (t - 0.5) / 0.5;
                r = 30 + (80 - 30) * p;
                g = 80 + (120 - 80) * p;
                b = 160 + (200 - 160) * p;
            }
            return { r: Math.round(r), g: Math.round(g), b: Math.round(b), t };
        }

        function drawCursorStar() {
            cursor.x += (mouse.x - cursor.x) * 0.12;
            cursor.y += (mouse.y - cursor.y) * 0.12;

            const col = getCursorColor();
            const rgb = `${col.r}, ${col.g}, ${col.b}`;

            trail.push({ x: cursor.x, y: cursor.y });
            if (trail.length > trailLen) trail.shift();

            for (let i = 0; i < trail.length; i++) {
                const t = trail[i];
                const progress = i / trail.length;
                cctx.beginPath();
                cctx.arc(t.x, t.y, progress * 3.5, 0, Math.PI * 2);
                cctx.fillStyle = `rgba(${rgb}, ${progress * 0.6})`;
                cctx.fill();
            }

            const size = 6;
            const glow = 8 + Math.sin(Date.now() * 0.005) * 3;

            cctx.beginPath();
            cctx.arc(cursor.x, cursor.y, size + glow + 10, 0, Math.PI * 2);
            cctx.fillStyle = `rgba(${rgb}, 0.06)`;
            cctx.fill();

            cctx.beginPath();
            cctx.arc(cursor.x, cursor.y, size + glow, 0, Math.PI * 2);
            cctx.fillStyle = `rgba(${rgb}, 0.15)`;
            cctx.fill();

            cctx.beginPath();
            cctx.arc(cursor.x, cursor.y, size, 0, Math.PI * 2);
            cctx.fillStyle = `rgba(${rgb}, 0.6)`;
            cctx.fill();

            cctx.beginPath();
            cctx.arc(cursor.x, cursor.y, 3, 0, Math.PI * 2);
            cctx.fillStyle = `rgba(${Math.min(col.r + 40, 255)}, ${Math.min(col.g + 30, 255)}, 255, 1)`;
            cctx.fill();

            cctx.strokeStyle = `rgba(${rgb}, ${0.3 + Math.sin(Date.now() * 0.003) * 0.15})`;
            cctx.lineWidth = 1;
            const flareLen = size + glow + 15;
            cctx.beginPath();
            cctx.moveTo(cursor.x - flareLen, cursor.y);
            cctx.lineTo(cursor.x + flareLen, cursor.y);
            cctx.moveTo(cursor.x, cursor.y - flareLen);
            cctx.lineTo(cursor.x, cursor.y + flareLen);
            cctx.stroke();

            // Subtle sparkle near BH
            const dist = Math.hypot(cursor.x - bhx, cursor.y - bhy);
            if (dist < LENSING_REGION) {
                sparkleThrottle++;
                if (sparkleThrottle % 10 === 0) {
                    spawnSparkles(cursor.x, cursor.y);
                }
            }
        }

        // ---- Main loop ----
        function drawLoop() {
            cctx.clearRect(0, 0, w, h);

            drawStarsToOffscreen();
            applyGravitationalLensing();

            if (mouseActive) drawCursorStar();
            drawSparkles();
            requestAnimationFrame(drawLoop);
        }

        init();
        drawLoop();
        window.addEventListener('resize', init);

        // Alien text
        const alienChars = '\u1400\u1401\u1402\u1403\u1404\u1405\u1406\u1407\u1408\u1409\u140A\u140B\u140C\u140D\u140E\u140F\u1410\u1411\u1412\u1413\u1414\u1415\u1416\u1417\u1418\u1419\u141A\u141B\u16A0\u16A1\u16A2\u16A3\u16A4\u16A5\u16A6\u16A7\u16A8\u16A9\u16AA\u16AB\u16AC\u16AD\u16AE\u16AF\u16B0\u16B1\u16B2\u16B3\u16B4\u16B5\u16B6\u16B7\u16B8\u16B9\u2D30\u2D31\u2D32\u2D33\u2D34\u2D35\u2D36\u2D37\u2D38\u2D39\u2D3A\u2D3B\u2D3C\u2D3D\u2D3E\u2D3F\u2D40\u2D41\u2D42\u2D43\u2D44\u2D45\u2D46\u2D47\u2D48\u2D49';
        function randomAlien(len) {
            let s = '';
            for (let i = 0; i < len; i++) s += alienChars[Math.floor(Math.random() * alienChars.length)];
            return s;
        }

        const titleEl = document.getElementById('alien-title');
        const taglineEl = document.getElementById('alien-tagline');
        titleEl.textContent = randomAlien(8);
        taglineEl.textContent = randomAlien(18);

        setInterval(() => {
            const t = titleEl.textContent.split('');
            const tg = taglineEl.textContent.split('');
            for (let i = 0; i < t.length; i++) {
                if (Math.random() < 0.15) t[i] = alienChars[Math.floor(Math.random() * alienChars.length)];
            }
            for (let i = 0; i < tg.length; i++) {
                if (Math.random() < 0.1) tg[i] = alienChars[Math.floor(Math.random() * alienChars.length)];
            }
            titleEl.textContent = t.join('');
            taglineEl.textContent = tg.join('');
        }, 150);
    </script>
</body>
</html>

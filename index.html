<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tolsadus</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a12;
            color: #e0dcd0;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        canvas#starfield {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(5, 5, 15, 0.8) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .signal-ring {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 2px solid rgba(80, 200, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 2rem;
            animation: pulse-ring 4s ease-in-out infinite;
        }

        .signal-ring::before,
        .signal-ring::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(80, 200, 255, 0.15);
        }

        .signal-ring::before {
            width: 220px;
            height: 220px;
            animation: pulse-ring 4s ease-in-out infinite 0.5s;
        }

        .signal-ring::after {
            width: 260px;
            height: 260px;
            animation: pulse-ring 4s ease-in-out infinite 1s;
        }

        .signal-core {
            width: 12px;
            height: 12px;
            background: #50c8ff;
            border-radius: 50%;
            box-shadow: 0 0 20px #50c8ff, 0 0 60px rgba(80, 200, 255, 0.4);
            animation: core-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes core-glow {
            0%, 100% { box-shadow: 0 0 20px #50c8ff, 0 0 60px rgba(80, 200, 255, 0.4); }
            50% { box-shadow: 0 0 30px #50c8ff, 0 0 80px rgba(80, 200, 255, 0.6), 0 0 120px rgba(80, 200, 255, 0.2); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #50c8ff, #a78bfa, #50c8ff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 6s ease infinite;
            margin-bottom: 1rem;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .tagline {
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(167, 139, 250, 0.7);
            margin-bottom: 3rem;
        }

        .links {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .links a {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            color: #e0dcd0;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border: 1px solid rgba(80, 200, 255, 0.25);
            border-radius: 2px;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .links a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(80, 200, 255, 0.08), transparent);
            transition: left 0.5s ease;
        }

        .links a:hover::before {
            left: 100%;
        }

        .links a:hover {
            border-color: rgba(80, 200, 255, 0.6);
            color: #50c8ff;
            box-shadow: 0 0 20px rgba(80, 200, 255, 0.15), inset 0 0 20px rgba(80, 200, 255, 0.05);
        }

        .links a svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .coord {
            position: fixed;
            bottom: 1.5rem;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: rgba(80, 200, 255, 0.3);
            font-family: 'Space Mono', monospace;
        }

        .coord-left { left: 1.5rem; }
        .coord-right { right: 1.5rem; }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; letter-spacing: 0.2em; }
            .tagline { font-size: 0.7rem; }
            .signal-ring { width: 130px; height: 130px; }
            .signal-ring::before { width: 170px; height: 170px; }
            .signal-ring::after { width: 210px; height: 210px; }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="vignette"></div>

    <div class="container">
        <div class="signal-ring">
            <div class="signal-core"></div>
        </div>

        <h1>tolsadus</h1>
        <p class="tagline">exploring the quantum void</p>

        <div class="links">
            <a href="https://x.com/tolsadus" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                X / Twitter
            </a>
            <a href="https://github.com/tolsadus" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                GitHub
            </a>
        </div>
    </div>

    <span class="coord coord-left">SIG /// 0x7E2</span>
    <span class="coord coord-right">FREQ /// 14.2 MHz</span>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let w, h, stars, shootingStars;

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;

            stars = Array.from({ length: 300 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.5 + 0.3,
                speed: Math.random() * 0.3 + 0.05,
                flicker: Math.random() * Math.PI * 2,
                flickerSpeed: Math.random() * 0.02 + 0.005
            }));

            shootingStars = [];
        }

        function spawnShootingStar() {
            if (Math.random() < 0.003 && shootingStars.length < 2) {
                shootingStars.push({
                    x: Math.random() * w,
                    y: 0,
                    len: Math.random() * 80 + 40,
                    speed: Math.random() * 6 + 4,
                    angle: Math.PI / 4 + Math.random() * 0.3,
                    opacity: 1
                });
            }
        }



        // Cursor star follower
        let mouse = { x: 0, y: 0 };
        let cursor = { x: 0, y: 0 };
        const trail = [];
        const trailLen = 12;
        let mouseActive = false;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            if (!mouseActive) {
                cursor.x = mouse.x;
                cursor.y = mouse.y;
                mouseActive = true;
            }
        });

        // Sparkle particles
        const sparkles = [];

        function spawnSparkles(x, y) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1.5;
                sparkles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: Math.random() * 0.03 + 0.015,
                    size: Math.random() * 2.5 + 1,
                    hue: Math.random() > 0.5 ? '80, 200, 255' : '167, 139, 250'
                });
            }
        }

        function drawSparkles() {
            for (let i = sparkles.length - 1; i >= 0; i--) {
                const sp = sparkles[i];
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.vx *= 0.96;
                sp.vy *= 0.96;
                sp.life -= sp.decay;

                if (sp.life <= 0) {
                    sparkles.splice(i, 1);
                    continue;
                }

                // Glow
                ctx.beginPath();
                ctx.arc(sp.x, sp.y, sp.size * 2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${sp.hue}, ${sp.life * 0.15})`;
                ctx.fill();

                // Core
                ctx.beginPath();
                ctx.arc(sp.x, sp.y, sp.size * sp.life, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${sp.hue}, ${sp.life * 0.8})`;
                ctx.fill();

                // Tiny cross flare
                ctx.strokeStyle = `rgba(${sp.hue}, ${sp.life * 0.4})`;
                ctx.lineWidth = 0.4;
                const fl = sp.size * 3 * sp.life;
                ctx.beginPath();
                ctx.moveTo(sp.x - fl, sp.y);
                ctx.lineTo(sp.x + fl, sp.y);
                ctx.moveTo(sp.x, sp.y - fl);
                ctx.lineTo(sp.x, sp.y + fl);
                ctx.stroke();
            }
        }

        let sparkleThrottle = 0;

        function drawCursorStar() {
            // Smooth follow
            cursor.x += (mouse.x - cursor.x) * 0.12;
            cursor.y += (mouse.y - cursor.y) * 0.12;

            // Trail
            trail.push({ x: cursor.x, y: cursor.y });
            if (trail.length > trailLen) trail.shift();

            for (let i = 0; i < trail.length; i++) {
                const t = trail[i];
                const progress = i / trail.length;
                const r = progress * 2;
                const alpha = progress * 0.3;
                ctx.beginPath();
                ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(80, 200, 255, ${alpha})`;
                ctx.fill();
            }

            // Main cursor star
            const size = 4;
            const glow = 3 + Math.sin(Date.now() * 0.005) * 1.5;

            // Outer glow
            ctx.beginPath();
            ctx.arc(cursor.x, cursor.y, size + glow, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(80, 200, 255, 0.08)';
            ctx.fill();

            // Inner glow
            ctx.beginPath();
            ctx.arc(cursor.x, cursor.y, size, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(80, 200, 255, 0.3)';
            ctx.fill();

            // Core
            ctx.beginPath();
            ctx.arc(cursor.x, cursor.y, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(220, 230, 255, 0.9)';
            ctx.fill();

            // Cross flare
            ctx.strokeStyle = `rgba(80, 200, 255, ${0.15 + Math.sin(Date.now() * 0.003) * 0.1})`;
            ctx.lineWidth = 0.5;
            const flareLen = size + glow + 6;
            ctx.beginPath();
            ctx.moveTo(cursor.x - flareLen, cursor.y);
            ctx.lineTo(cursor.x + flareLen, cursor.y);
            ctx.moveTo(cursor.x, cursor.y - flareLen);
            ctx.lineTo(cursor.x, cursor.y + flareLen);
            ctx.stroke();

            // Check collision with signal ring center
            const ring = document.querySelector('.signal-ring');
            if (ring) {
                const rect = ring.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.hypot(cursor.x - cx, cursor.y - cy);
                if (dist < 90) {
                    sparkleThrottle++;
                    if (sparkleThrottle % 3 === 0) {
                        spawnSparkles(cursor.x, cursor.y);
                    }
                }
            }
        }

        function drawLoop() {
            ctx.clearRect(0, 0, w, h);

            // Nebula glow
            const grd = ctx.createRadialGradient(w * 0.3, h * 0.4, 0, w * 0.3, h * 0.4, w * 0.5);
            grd.addColorStop(0, 'rgba(80, 40, 120, 0.04)');
            grd.addColorStop(1, 'transparent');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, w, h);

            const grd2 = ctx.createRadialGradient(w * 0.7, h * 0.6, 0, w * 0.7, h * 0.6, w * 0.4);
            grd2.addColorStop(0, 'rgba(30, 60, 120, 0.03)');
            grd2.addColorStop(1, 'transparent');
            ctx.fillStyle = grd2;
            ctx.fillRect(0, 0, w, h);

            for (const s of stars) {
                s.flicker += s.flickerSpeed;
                const opacity = 0.4 + Math.sin(s.flicker) * 0.3;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(220, 225, 240, ${opacity})`;
                ctx.fill();
                if (s.r > 1.2) {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(80, 200, 255, ${opacity * 0.1})`;
                    ctx.fill();
                }
                s.y += s.speed;
                if (s.y > h + 5) { s.y = -5; s.x = Math.random() * w; }
            }

            spawnShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                const endX = ss.x - Math.cos(ss.angle) * ss.len;
                const endY = ss.y - Math.sin(ss.angle) * ss.len;
                const grad = ctx.createLinearGradient(ss.x, ss.y, endX, endY);
                grad.addColorStop(0, `rgba(200, 220, 255, ${ss.opacity})`);
                grad.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ss.x += Math.cos(ss.angle) * ss.speed;
                ss.y += Math.sin(ss.angle) * ss.speed;
                ss.opacity -= 0.008;
                if (ss.opacity <= 0 || ss.x > w + 100 || ss.y > h + 100) {
                    shootingStars.splice(i, 1);
                }
            }

            if (mouseActive) drawCursorStar();
            drawSparkles();
            requestAnimationFrame(drawLoop);
        }

        init();
        drawLoop();
        window.addEventListener('resize', init);
    </script>
</body>
</html>
